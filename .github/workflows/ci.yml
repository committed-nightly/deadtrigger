name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests build real repositories and make real commits in them.
      # Each one sets a local identity, so this is only a backstop against a
      # runner with no global one at all.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  dogfood:
    # Run the tool on this repository, for real.
    #
    # fetch-depth: 0 is not incidental -- it is the advice the tool gives
    # when it declines the branch checks, so this job is also the test that
    # the advice works. If a future change stops the branch checks running
    # under a full clone, the last step here goes red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: our own workflows are alive
        run: deadtrigger --default-branch main

      # `code=0; cmd || code=$?` rather than `cmd; code=$?`, because these
      # steps run under `bash -e` and the whole point is to run a command
      # that exits non-zero.
      - name: a dead path filter is caught
        run: |
          cat > .github/workflows/scratch.yml <<'YAML'
          name: Scratch
          on:
            push:
              paths: ['no/such/directory/**']
          jobs:
            a:
              runs-on: ubuntu-latest
              steps: [{run: 'true'}]
          YAML
          code=0; deadtrigger --default-branch main || code=$?
          rm .github/workflows/scratch.yml
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: a revision that does not exist is an error, not a pass
        run: |
          code=0; deadtrigger --ref no-such-revision || code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: nothing is left unchecked in a full clone
        run: |
          deadtrigger --default-branch main > report.txt
          # Whole line, and before the absence check, because the absence
          # check says nothing about how much was read. The no-workflows case
          # is already covered -- deadtrigger exits 2 and `bash -e` kills the
          # step at the redirect -- but a second workflow file in this
          # repository would read as `2 workflows checked, clean` and the
          # guard would go on passing without a word about its subject having
          # changed. -x so the count has to be re-read rather than grown into.
          grep -qxF '1 workflow checked, clean' report.txt
          if grep -q '^not checked:' report.txt; then
            cat report.txt
            echo "a check declined to run in a full clone"
            exit 1
          fi

      - name: the guard above fires when a check really is declined
        # The guard is an absence check and nothing here established that
        # `not checked:` can be printed at all, so it would have gone on
        # passing if the skips stopped working (logbook#64). The witness
        # cannot come from this repository, because the guard requires the
        # string's absence here -- it has to come from a corpus where the
        # line does appear.
        #
        # One control per cause. `core.check` declines in exactly two places
        # and a witness for one says nothing about the other; the test in
        # tests/test_dogfood.py fails if a third one is added without a
        # control here.
        #
        # Both corpora are built here rather than inherited. Plain
        # actions/checkout leaves refs/remotes/origin/HEAD unset, which would
        # witness the second cause for free from the runner and stop doing it,
        # silently, the day that changes.
        run: |
          root=/tmp/control
          mkdir -p "$root/.github/workflows"
          cat > "$root/.github/workflows/live.yml" <<'YAML'
          name: Live
          on:
            push:
              branches: [main]
          jobs:
            a:
              runs-on: ubuntu-latest
              steps: [{run: 'true'}]
          YAML
          git -C "$root" init -q -b main
          git -C "$root" add -A
          git -C "$root" -c user.name=ci -c user.email=ci@example.invalid \
            commit -q -m control

          # A fresh `git init` has no origin, so there is no default branch to
          # find and the default-branch checks decline.
          deadtrigger "$root" > no-default-branch.txt
          cat no-default-branch.txt
          grep -q '^not checked: default-branch-only triggers --' no-default-branch.txt

          # `git clone` does set origin/HEAD, so in the shallow copy the only
          # check that declines is the one about branch and tag lists.
          git clone -q --depth 1 "file://$root" /tmp/control-shallow
          deadtrigger /tmp/control-shallow --default-branch main > shallow.txt
          cat shallow.txt
          grep -q '^not checked: branch and tag filters --' shallow.txt

          # Both controls exit 0. A declined check does not change the exit
          # code, which is the whole reason the guard above reads stdout.
