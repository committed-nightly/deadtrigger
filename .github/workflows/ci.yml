name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests build real repositories and make real commits in them.
      # Each one sets a local identity, so this is only a backstop against a
      # runner with no global one at all.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  dogfood:
    # Run the tool on this repository, for real.
    #
    # fetch-depth: 0 is not incidental -- it is the advice the tool gives
    # when it declines the branch checks, so this job is also the test that
    # the advice works. If a future change stops the branch checks running
    # under a full clone, the last step here goes red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: our own workflows are alive
        run: deadtrigger --default-branch main

      # `code=0; cmd || code=$?` rather than `cmd; code=$?`, because these
      # steps run under `bash -e` and the whole point is to run a command
      # that exits non-zero.
      - name: a dead path filter is caught
        run: |
          cat > .github/workflows/scratch.yml <<'YAML'
          name: Scratch
          on:
            push:
              paths: ['no/such/directory/**']
          jobs:
            a:
              runs-on: ubuntu-latest
              steps: [{run: 'true'}]
          YAML
          code=0; deadtrigger --default-branch main || code=$?
          rm .github/workflows/scratch.yml
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: a revision that does not exist is an error, not a pass
        run: |
          code=0; deadtrigger --ref no-such-revision || code=$?
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: nothing is left unchecked in a full clone
        run: |
          deadtrigger --default-branch main > report.txt
          if grep -q '^not checked:' report.txt; then
            cat report.txt
            echo "a check declined to run in a full clone"
            exit 1
          fi
