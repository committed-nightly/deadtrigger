[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deadtrigger"
version = "0.1.0"
description = "Find the GitHub Actions workflows that can never run: dead branch and path filters, workflow_run names that match nothing, crons that never fire."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["github-actions", "workflows", "ci", "linter", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
deadtrigger = "deadtrigger.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/deadtrigger"

[tool.hatch.build.targets.wheel]
packages = ["src/deadtrigger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
